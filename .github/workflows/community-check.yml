name: Community builds check
# Free nightly check (no AI): rebuild, run the regression tests, and re-test every community build in
# docs/community/builds against the current calculator. The research runs read docs/community/report.md first.
on:
  schedule:
    - cron: "40 18 * * *"   # every day 18:40 UTC (03:40 KST/JST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["docs/community/builds/**", "src/**", "scripts/community_check.js", "scripts/regress.js"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v5
        with: { node-version: "20" }
      - name: Build page
        run: bash scripts/build.sh
      - name: Install Playwright
        run: |
          npm i --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Regression tests
        run: node scripts/regress.js
      - name: Re-test community builds
        run: node scripts/community_check.js
      - name: Commit report if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/community/report.md
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "chore: community builds report" && git reset --hard HEAD && git clean -fdq && git pull --rebase && git push; fi
